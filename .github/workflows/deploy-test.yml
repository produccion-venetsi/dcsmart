# Tercer ambiente: TEST.
#
# Pushear a la branch `test` despliega:
#   - Backend a un servicio Cloud Run SEPARADO (`dcsmart-backend-test`). Esta es
#     la diferencia clave con `dev`: hoy un push a `dev` redeploya el MISMO
#     backend que usa producción. Acá el código bajo prueba corre aislado.
#   - Frontend al canal preview `test` de Firebase Hosting, apuntando al
#     backend de test (la URL del servicio se lee después de deployarlo,
#     porque los canales preview no pasan por el rewrite de firebase.json).
#
# DATOS AISLADOS: el backend de test corre contra la base `dcsmart_test` de la
# misma instancia de Cloud SQL, con una copia de los datos reales (las últimas
# 20 cajas de cada local). Se puede tocar todo sin afectar a nadie. La URL sale
# del secret DATABASE_URL_TEST; el resto de la configuración se reusa de
# producción para que no haya dos copias del YAML que se desincronicen.
#
# Para refrescar la copia: backend/scripts/copiar-a-lab.js con LAB_URL
# apuntando a dcsmart_test (ver la nota de la base de laboratorio).
#
# Uso: git push origin <mi-branch>:test  (pisa la branch test con lo que quieras probar)

name: Deploy to TEST (Cloud Run + Firebase channel)

on:
  push:
    branches:
      - test

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    env:
      IMAGE: us-central1-docker.pkg.dev/dc-smart-mvp/dcsmart/dcsmart-backend
    outputs:
      backend_url: ${{ steps.url.outputs.backend_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build imagen Docker
        run: docker build -t ${{ env.IMAGE }}:test-${{ github.sha }} backend/

      - name: Push imagen Docker
        run: docker push ${{ env.IMAGE }}:test-${{ github.sha }}

      - name: Crear env vars file
        env:
          # Si algún día se carga CLOUDRUN_ENV_YAML_TEST (base de datos de
          # prueba propia), test queda 100% aislado sin tocar este archivo.
          CLOUDRUN_ENV_YAML: ${{ secrets.CLOUDRUN_ENV_YAML }}
          # La base propia de test: es la UNICA variable que cambia respecto de
          # produccion, asi no hay dos copias del YAML que se desincronicen.
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          GCS_PROJECT_ID: ${{ secrets.GCS_PROJECT_ID }}
          ANALYTICS_BACKEND_URL: ${{ secrets.ANALYTICS_BACKEND_URL }}
          COSTOS_BACKEND_URL: ${{ secrets.COSTOS_BACKEND_URL }}
        run: |
          # Se saca el DATABASE_URL de produccion y se pone el de test: si el
          # secret no esta cargado el deploy FALLA a proposito, en vez de
          # levantar test contra la base real.
          if [ -z "$DATABASE_URL_TEST" ]; then
            echo "Falta el secret DATABASE_URL_TEST: sin el, test correria contra produccion." >&2
            exit 1
          fi
          printf '%s\n' "$CLOUDRUN_ENV_YAML" | grep -v '^DATABASE_URL' > backend/.env.cloudrun.yaml
          printf 'DATABASE_URL: %s\n' "$DATABASE_URL_TEST" >> backend/.env.cloudrun.yaml
          printf 'GCS_BUCKET_NAME: %s\n' "$GCS_BUCKET_NAME" >> backend/.env.cloudrun.yaml
          printf 'GCS_PROJECT_ID: %s\n' "$GCS_PROJECT_ID" >> backend/.env.cloudrun.yaml
          printf 'ANALYTICS_BACKEND_URL: %s\n' "$ANALYTICS_BACKEND_URL" >> backend/.env.cloudrun.yaml
          printf 'COSTOS_BACKEND_URL: %s\n' "$COSTOS_BACKEND_URL" >> backend/.env.cloudrun.yaml

      - name: Deploy a Cloud Run (servicio de TEST)
        run: |
          gcloud run deploy dcsmart-backend-test \
            --image ${{ env.IMAGE }}:test-${{ github.sha }} \
            --region us-central1 \
            --platform managed \
            --env-vars-file backend/.env.cloudrun.yaml \
            --set-secrets "INTERNAL_SHARED_SECRET=internal-shared-secret:latest" \
            --add-cloudsql-instances dc-smart-mvp:us-central1:dcsmart-mvp-insta \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --project dc-smart-mvp \
            --quiet

      - name: Leer URL del backend de test
        id: url
        run: |
          URL=$(gcloud run services describe dcsmart-backend-test \
            --region us-central1 --project dc-smart-mvp \
            --format 'value(status.url)')
          echo "backend_url=$URL" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4
        with:
          # Mismo motivo que en deploy-dev.yml: la version cuenta commits.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_APP_ENV: test
          # Directo al backend de TEST: los canales preview no pasan por el
          # rewrite /api/** de firebase.json (mismo criterio que deploy-dev).
          VITE_API_URL: ${{ needs.deploy-backend.outputs.backend_url }}/api
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID_FRONTEND }}
          VITE_COSTOS_URL: ${{ secrets.VITE_COSTOS_URL_DEV || secrets.VITE_COSTOS_URL }}
          VITE_TAREAS_URL: ${{ secrets.VITE_TAREAS_URL }}

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy a Firebase Hosting (canal test)
        run: npx firebase-tools@latest hosting:channel:deploy test --project dc-smart-mvp
